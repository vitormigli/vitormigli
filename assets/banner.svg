<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0a07"/>
      <stop offset="100%" stop-color="#241a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b8860b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- neural-net constellation, right side -->
  <g stroke="#c99a4a" stroke-width="1" opacity="0.45">
    <line x1="760" y1="70" x2="860" y2="50"/>
    <line x1="760" y1="70" x2="840" y2="130"/>
    <line x1="860" y1="50" x2="960" y2="90"/>
    <line x1="840" y1="130" x2="960" y2="90"/>
    <line x1="840" y1="130" x2="820" y2="200"/>
    <line x1="960" y1="90" x2="1060" y2="60"/>
    <line x1="960" y1="90" x2="1040" y2="150"/>
    <line x1="820" y1="200" x2="920" y2="230"/>
    <line x1="1040" y1="150" x2="920" y2="230"/>
    <line x1="1040" y1="150" x2="1120" y2="110"/>
    <line x1="1060" y1="60" x2="1140" y2="100"/>
    <line x1="1120" y1="110" x2="1140" y2="100"/>
    <line x1="920" y1="230" x2="1080" y2="220"/>
    <line x1="1040" y1="150" x2="1080" y2="220"/>
  </g>
  <g fill="#e0b25c">
    <circle cx="760" cy="70" r="4"/>
    <circle cx="860" cy="50" r="3"/>
    <circle cx="840" cy="130" r="5"/>
    <circle cx="960" cy="90" r="4"/>
    <circle cx="820" cy="200" r="3"/>
    <circle cx="1060" cy="60" r="3"/>
    <circle cx="1040" cy="150" r="5"/>
    <circle cx="920" cy="230" r="4"/>
    <circle cx="1120" cy="110" r="3"/>
    <circle cx="1140" cy="100" r="3"/>
    <circle cx="1080" cy="220" r="3"/>
  </g>

  <!-- terminal window -->
  <rect x="48" y="46" width="620" height="188" rx="10" fill="#161009" stroke="#3a2c1a" stroke-width="1.5"/>
  <rect x="48" y="46" width="620" height="30" rx="10" fill="#1f1710"/>
  <rect x="48" y="66" width="620" height="10" fill="#1f1710"/>
  <circle cx="70" cy="61" r="5" fill="#e0574a"/>
  <circle cx="88" cy="61" r="5" fill="#e0b25c"/>
  <circle cx="106" cy="61" r="5" fill="#5fb87a"/>
  <text x="340" y="65" fill="#7a6a55" font-size="12" text-anchor="middle">vitor@portfolio: ~</text>

  <text x="70" y="112" font-size="17" fill="#e0b25c">$ whoami</text>
  <text x="70" y="138" font-size="17" fill="#f2e6d0">vitor_migliorini</text>
  <text x="70" y="168" font-size="17" fill="#e0b25c">$ role --current</text>
  <text x="70" y="194" font-size="17" fill="#f2e6d0">ai_engineer · production llm systems</text>
  <text x="70" y="220" font-size="17" fill="#e0b25c">$ <tspan fill="#f2e6d0">_</tspan></text>
  <rect x="82" y="208" width="10" height="16" fill="#e0b25c">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="730" y="270" font-size="13" fill="#7a6a55" font-family="Consolas, monospace">document extraction · RAG · agents</text>
</svg>
