<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0805"/>
      <stop offset="100%" stop-color="#26190d"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#b8860b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2e6d0"/>
      <stop offset="55%" stop-color="#e6bd6e"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- name -->
  <text x="50" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800"
        letter-spacing="1.5" fill="url(#nameGrad)">VITOR MIGLIORINI</text>
  <text x="52" y="100" font-size="14" letter-spacing="4" fill="#9c7d4c">AI ENGINEER &#183; PRODUCTION LLM SYSTEMS</text>
  <line x1="50" y1="116" x2="1150" y2="116" stroke="#3a2c1a" stroke-width="1"/>

  <!-- terminal window -->
  <g transform="translate(48,140)">
    <rect width="590" height="150" rx="10" fill="#161009" stroke="#3a2c1a" stroke-width="1.5"/>
    <rect width="590" height="28" rx="10" fill="#1f1710"/>
    <rect y="18" width="590" height="10" fill="#1f1710"/>
    <circle cx="20" cy="14" r="5" fill="#e0574a"/>
    <circle cx="38" cy="14" r="5" fill="#e0b25c"/>
    <circle cx="56" cy="14" r="5" fill="#5fb87a"/>
    <text x="320" y="18" fill="#7a6a55" font-size="11" text-anchor="middle">vitor@portfolio: ~</text>

    <text x="20" y="55" font-size="15" fill="#e0b25c">$ whoami</text>
    <text x="20" y="76" font-size="15" fill="#f2e6d0">vitor_migliorini</text>
    <text x="20" y="102" font-size="15" fill="#e0b25c">$ eval --latest</text>
    <text x="20" y="123" font-size="15" fill="#f2e6d0">99.5% accuracy &#183; 2.2x cheaper (haiku-4.5)</text>
    <text x="20" y="145" font-size="15" fill="#e0b25c">$ <tspan fill="#f2e6d0">_</tspan></text>
    <rect x="32" y="133" width="9" height="15" fill="#e0b25c">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- skill graph -->
  <g stroke="#c99a4a" stroke-width="1.1" opacity="0.5">
    <line x1="900" y1="185" x2="800" y2="230"/>
    <line x1="900" y1="185" x2="1000" y2="220"/>
    <line x1="900" y1="185" x2="880" y2="285"/>
    <line x1="900" y1="185" x2="1055" y2="150"/>
    <line x1="1000" y1="220" x2="1120" y2="245"/>
    <line x1="800" y1="230" x2="880" y2="285"/>
    <line x1="1000" y1="220" x2="1055" y2="150"/>
  </g>

  <g font-size="13" fill="#f2e6d0" text-anchor="middle">
    <g>
      <circle cx="900" cy="185" r="14" fill="none" stroke="#e0b25c" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="14;19;14" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="185" r="7" fill="#e6bd6e"/>
      <text x="900" y="167">Claude</text>
    </g>
    <g>
      <circle cx="800" cy="230" r="11" fill="none" stroke="#e0b25c" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="11;16;11" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="230" r="5" fill="#e6bd6e"/>
      <text x="800" y="253">RAG</text>
    </g>
    <g>
      <circle cx="1000" cy="220" r="11" fill="none" stroke="#e0b25c" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="11;16;11" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="220" r="5" fill="#e6bd6e"/>
      <text x="1000" y="243">Agents</text>
    </g>
    <g>
      <circle cx="880" cy="285" r="11" fill="none" stroke="#e0b25c" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="11;16;11" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="285" r="5" fill="#e6bd6e"/>
      <text x="880" y="307">Evals</text>
    </g>
    <g>
      <circle cx="1055" cy="150" r="10" fill="none" stroke="#e0b25c" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="10;15;10" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1055" cy="150" r="4.5" fill="#e6bd6e"/>
      <text x="1055" y="133">Python</text>
    </g>
    <g>
      <circle cx="1120" cy="245" r="10" fill="none" stroke="#e0b25c" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="10;15;10" dur="2.6s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="245" r="4.5" fill="#e6bd6e"/>
      <text x="1120" y="268">Docker</text>
    </g>
  </g>
</svg>
